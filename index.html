<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="Bomberman — a faithful fan remake of the PlayStation classic, playable in the browser." />
    <title>Bomberman</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='7' cy='9' r='6' fill='%23202040'/%3E%3Ccircle cx='5' cy='7' r='1.5' fill='%23fff'/%3E%3Cpath d='M10 4 L13 1' stroke='%23c08040' stroke-width='1.5'/%3E%3Ccircle cx='13.5' cy='1.5' r='1.3' fill='%23ffb000'/%3E%3C/svg%3E" />
    <style>
      :root {
        color-scheme: dark;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: #000;
        overflow: hidden;
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
      }
      #stage {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #screen {
        display: block;
        image-rendering: pixelated;
        image-rendering: crisp-edges;
        background: #000;
        outline: none;
      }
      /* ---------- touch controller (only shown on touch devices) ---------- */
      #touch {
        position: fixed;
        inset: 0;
        pointer-events: none;
        display: none;
      }
      body.touch #touch {
        display: block;
      }
      .tpad {
        position: absolute;
        pointer-events: auto;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.08);
        border: 2px solid rgba(255, 255, 255, 0.22);
        touch-action: none;
      }
      #tp-dpad {
        width: 150px;
        height: 150px;
        left: max(18px, env(safe-area-inset-left));
        bottom: max(22px, env(safe-area-inset-bottom));
      }
      #tp-dpad::before,
      #tp-dpad::after {
        content: '';
        position: absolute;
        background: rgba(255, 255, 255, 0.25);
        border-radius: 6px;
      }
      #tp-dpad::before {
        left: 50%;
        top: 14%;
        width: 34%;
        height: 72%;
        transform: translateX(-50%);
      }
      #tp-dpad::after {
        top: 50%;
        left: 14%;
        height: 34%;
        width: 72%;
        transform: translateY(-50%);
      }
      .tbtn {
        position: absolute;
        pointer-events: auto;
        border-radius: 50%;
        width: 74px;
        height: 74px;
        display: flex;
        align-items: center;
        justify-content: center;
        font: bold 20px/1 system-ui, sans-serif;
        color: rgba(255, 255, 255, 0.85);
        background: rgba(255, 60, 60, 0.28);
        border: 2px solid rgba(255, 255, 255, 0.3);
        touch-action: none;
      }
      .tbtn.on {
        background: rgba(255, 90, 90, 0.6);
      }
      #tb-a {
        right: max(22px, env(safe-area-inset-right));
        bottom: max(70px, calc(env(safe-area-inset-bottom) + 48px));
      }
      #tb-b {
        right: max(112px, calc(env(safe-area-inset-right) + 90px));
        bottom: max(22px, env(safe-area-inset-bottom));
        background: rgba(60, 120, 255, 0.28);
      }
      #tb-b.on {
        background: rgba(90, 150, 255, 0.6);
      }
      #tb-c {
        right: max(112px, calc(env(safe-area-inset-right) + 90px));
        bottom: max(112px, calc(env(safe-area-inset-bottom) + 90px));
        width: 58px;
        height: 58px;
        font-size: 16px;
        background: rgba(80, 200, 120, 0.28);
      }
      #tb-c.on {
        background: rgba(100, 230, 140, 0.6);
      }
      .tsmall {
        position: absolute;
        pointer-events: auto;
        top: max(10px, env(safe-area-inset-top));
        padding: 8px 14px;
        border-radius: 14px;
        font: bold 12px/1 system-ui, sans-serif;
        letter-spacing: 1px;
        color: rgba(255, 255, 255, 0.8);
        background: rgba(255, 255, 255, 0.1);
        border: 1px solid rgba(255, 255, 255, 0.25);
        touch-action: none;
      }
      #tb-start {
        right: max(12px, env(safe-area-inset-right));
      }
      #tb-select {
        right: max(96px, calc(env(safe-area-inset-right) + 84px));
      }
      .tsmall.on {
        background: rgba(255, 255, 255, 0.35);
      }
      /* Phones held upright: the picture sits at the top, SELECT/START above the pad. */
      @media (orientation: portrait) {
        body.touch #stage {
          padding-top: env(safe-area-inset-top);
        }
        body.touch .tsmall {
          top: auto;
          bottom: max(196px, calc(env(safe-area-inset-bottom) + 174px));
        }
        body.touch #tb-select {
          right: auto;
          left: calc(50% - 96px);
        }
        body.touch #tb-start {
          right: auto;
          left: calc(50% + 14px);
        }
      }
      #boot {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #fff;
        font: 14px/1.4 monospace;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="stage">
      <canvas id="screen" tabindex="0" aria-label="Bomberman game screen"></canvas>
    </div>
    <div id="touch" aria-hidden="true">
      <div class="tpad" id="tp-dpad"></div>
      <div class="tbtn" id="tb-a">A</div>
      <div class="tbtn" id="tb-b">B</div>
      <div class="tbtn" id="tb-c">C</div>
      <div class="tsmall" id="tb-select">SELECT</div>
      <div class="tsmall" id="tb-start">START</div>
    </div>
    <div id="boot">LOADING…</div>
    <noscript><p style="color:#fff;font:14px monospace;text-align:center;margin-top:40vh">This game needs JavaScript.</p></noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
